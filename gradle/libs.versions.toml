[versions]
connector-sdk = "1.0.0"
slf4j-api = "2.0.16"
slf4j-simple = "2.0.16"
mcp-bom = "0.10.0"
guava = "32.1.1-jre"
xjc = "1.8.2"
junit = "5.14.3"

[libraries]
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j-api" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j-simple" }

connector-api = { module = "io.transconnect.connector:api", version.ref = "connector-sdk" }
connector-war-bridge = { module = "io.transconnect.connector:war-connector-bridge", version.ref = "connector-sdk" }
connector-yaml-descriptor = { module = "io.transconnect.connector.extensions:yaml-descriptor", version.ref = "connector-sdk" }
connector-jaxb = { module = "io.transconnect.connector.extensions:jaxb", version.ref = "connector-sdk" }

mcp-bom = { module = "io.modelcontextprotocol.sdk:mcp-bom", version.ref = "mcp-bom" }
mcp = { module = "io.modelcontextprotocol.sdk:mcp" }

guava = { module = "com.google.guava:guava", version.ref = "guava" }

junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }

[plugins]
xjc = { id = "com.github.bjornvester.xjc", version.ref = "xjc" }